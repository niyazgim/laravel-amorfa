services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app:dev
    container_name: app_dev
    env_file: ./.env
    environment:
      DB_HOST: db
      REDIS_HOST: valkey
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - .:/app  # Live coding mounts
      - app_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - main-network
    ports:
      - "8000:8000"  # Direct access for local testing
