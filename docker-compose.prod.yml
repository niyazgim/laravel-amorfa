services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app:latest
    container_name: app_prod
    env_file: ./.env
    environment:
      DB_HOST: db
      REDIS_HOST: valkey
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app_storage:/app/storage  # Only persist runtime assets
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - main-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=${DOMAIN}"
      - "traefik.http.routers.app.entrypoints=${ENTRYPOINT:-websecure}"
      - "traefik.http.routers.app.tls=${TLS_ENABLED:-true}"
      - "traefik.http.routers.app.tls.certresolver=${CERT_RESOLVER:-myresolver}"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
