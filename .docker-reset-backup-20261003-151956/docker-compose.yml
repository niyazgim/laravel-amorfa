services:
  # --- Traefik Proxy ---
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=your-email@example.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt
    networks:
      - app-network

  # --- Laravel Application ---
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    depends_on:
      - postgres
      - valkey
    environment:
      DB_HOST: postgres
      REDIS_HOST: valkey # Laravel uses the Redis protocol to communicate with Valkey
    volumes:
      - .:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laravel.rule=Host(`yourdomain.com`)"
      - "traefik.http.routers.laravel.entrypoints=websecure"
      - "traefik.http.routers.laravel.tls.certresolver=myresolver"
      - "traefik.http.services.laravel.loadbalancer.server.port=80"
    networks:
      - app-network

  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: \${DB_DATABASE:-laravel}
      POSTGRES_USER: \${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: \${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  # --- Valkey Cache & Queue ---
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: valkey-cache
    restart: unless-stopped
    command: valkey-server --requirepass \${REDIS_PASSWORD:-secretvalkeypass}
    volumes:
      - valkeydata:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  traefik-certificates:
  pgdata:
  valkeydata:
